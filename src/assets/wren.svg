<!--
  Wrendex wren mark. Single-color, uses currentColor so it inherits from the
  surrounding text/icon color. Adapted to a 24x24 viewBox from the marketing
  site's nav brand mark (wrendex_marketing/src/partials/navbar.ejs) so the
  dashboard and the marketing site share the same silhouette: small body,
  perked head, slightly upturned tail.
-->
